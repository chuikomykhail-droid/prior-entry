# Builds the project's image on every push, as a reviewer would with `docker compose`: the Rust build
# and its tests run inside the image build, then the Python tests run in the container without network.
# The full `reproduce` service (recompute everything from data/raw offline and compare with data/derived)
# takes hours on a runner, so it runs only on request: Actions > docker > Run workflow > full.
name: docker

on:
  push:
  workflow_dispatch:
    inputs:
      full:
        description: Recompute data/derived from data/raw and compare
        type: boolean
        default: false

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Build the image (itb and its tests)
        run: docker compose build reproduce

      - name: Tests, and the recomputation when asked for
        run: |
          if [ "${{ inputs.full }}" = "true" ]; then
            docker compose run --rm reproduce
          else
            docker compose run --rm reproduce python -m pytest -q analysis/tests
          fi
