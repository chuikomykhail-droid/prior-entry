name: docker
on:
  push:

jobs:
  reproduce:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.runner != 'ubuntu-latest' }}  # arm64 is a second opinion, what a Mac would run
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build the image (itb and its tests)
        run: docker compose build reproduce
      - name: The one command, as a reader runs it
        shell: bash
        run: |
          docker compose up --no-color 2>&1 | tee up.txt
          test "$(docker inspect -f '{{.State.ExitCode}}' "$(docker compose ps -a -q reproduce)")" = 0
      - name: Publish the comparison on the run page
        if: always()
        shell: bash
        run: |
          [ -f up.txt ] || exit 0
          { echo "### docker compose up, ${{ runner.arch }}"; echo '```'; sed -nE 's/^reproduce-1 +\| //p' up.txt | grep -vE 'done$|figures ->|^/.*results\.md$|^[0-9]+ (live|pairs)'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
