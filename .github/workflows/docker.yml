name: docker
on:
  push:

jobs:
  reproduce:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.runner != 'ubuntu-latest' }}  # arm64 is a second opinion, what a Mac would run
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build the image (itb and its tests)
        run: docker compose build reproduce
      - name: Tests
        run: docker compose run -T --rm reproduce python -m pytest -q analysis/tests
      - name: Quick recomputation, compared with data/derived
        shell: bash
        run: |
          docker compose run -T --rm reproduce python -m analysis check --details 25 2>&1 | tee check.txt
      - name: One-minute dry-run on mainnet, as `docker compose up` does it
        continue-on-error: true  # depends on the public RPC and on what the runner's network lets through
        run: docker compose run -T --rm --no-deps dryrun-short
      - name: Publish the comparison on the run page
        if: always()
        shell: bash
        run: |
          [ -f check.txt ] || exit 0
          { echo "### Quick recomputation, ${{ runner.arch }}"; echo '```'; grep -vE 'done$|figures ->|^/.*results\.md$|^[0-9]+ (live|pairs)' check.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
